<div class="min-h-screen bg-gradient-to-br from-cyan-50 via-white to-teal-100 flex items-center justify-center p-6">

    <div class="w-full max-w-md rounded-3xl bg-white shadow-xl border border-slate-200 p-8">

        <a
            routerLink="/auth/recuperar-password"
            class="inline-flex items-center gap-2 text-sm font-bold text-slate-500 hover:text-teal-600 transition">

            <svg [lucideIcon]="backIcon" class="h-4 w-4"></svg>

            Regresar

        </a>

        <div class="mt-6 flex justify-center">

            <div
                class="h-16 w-16 rounded-3xl bg-teal-50 text-teal-600 flex items-center justify-center">

                <svg [lucideIcon]="mailIcon" class="h-8 w-8"></svg>

            </div>

        </div>

        <h1 class="mt-6 text-center text-3xl font-black text-slate-900">

            Verificar código

        </h1>

        <p class="mt-3 text-center text-sm text-slate-500 leading-6">

            Hemos enviado un código de verificación al correo

            <span class="font-bold text-teal-600">

                {{ email() }}

            </span>

        </p>

        <div class="mt-8">

            <input

                maxlength="6"

                [(ngModel)]="code"

                class="w-full rounded-2xl border border-slate-300 text-center text-3xl tracking-[1rem] py-4 outline-none focus:border-teal-500"

                placeholder="000000">

        </div>

        <button

            (click)="verify()"

            [disabled]="loading()"

            class="mt-8 w-full h-12 rounded-2xl bg-teal-500 hover:bg-teal-600 text-white font-black transition">

            Verificar código

        </button>

        <div class="mt-6 text-center">

            @if (!canResend()) {

                <p class="text-sm text-slate-500">

                    Reenviar código en

                    <span class="font-black text-teal-600">

                        {{ seconds() }} s

                    </span>

                </p>

            }

            @else {

                <button

                    (click)="resend()"

                    class="font-bold text-teal-600 hover:underline">

                    Reenviar código

                </button>

            }

        </div>

    </div>

</div>
