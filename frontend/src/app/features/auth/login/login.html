<div
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-slate-50 bg-[radial-gradient(circle_at_top_left,rgba(20,184,166,0.14),transparent_34%),radial-gradient(circle_at_bottom_right,rgba(6,182,212,0.12),transparent_32%)] p-7"
>
  <div
    class="animate-float pointer-events-none absolute left-[8%] top-[8%] h-[230px] w-[230px] rounded-full bg-teal-400/15 blur-lg"
  ></div>

  <div
    class="animate-float pointer-events-none absolute bottom-[6%] right-[7%] h-[280px] w-[280px] rounded-full bg-cyan-400/15 blur-xl [animation-delay:1.2s]"
  ></div>

  <section
    class="animate-card-enter relative z-10 w-full max-w-[440px] rounded-[30px] border border-slate-200/95 bg-white/95 p-[34px] shadow-[0_24px_70px_rgba(15,23,42,0.13)] backdrop-blur-xl"
  >
    <div class="text-center">
      <div
        class="animate-logo-pop mx-auto mb-5 flex h-[72px] w-[72px] items-center justify-center rounded-3xl bg-gradient-to-br from-teal-500 to-cyan-500 text-white shadow-[0_16px_32px_rgba(20,184,166,0.24)]"
      >
        <svg [lucideIcon]="logoIcon" class="h-8 w-8"></svg>
      </div>

      <h1 class="m-0 text-[30px] font-black tracking-[-0.045em] text-slate-900">
        Sistema Académico
      </h1>

      <p class="mt-2 text-[15px] font-semibold text-slate-500">
        Inicia sesión para continuar
      </p>
    </div>

    <form (ngSubmit)="submit()" class="mt-[34px] grid gap-[21px]">
      <div>
        <label class="mb-2 block text-sm font-extrabold text-slate-900">
          Correo electrónico
        </label>

        <div
          class="group flex h-[54px] items-center rounded-[17px] border border-slate-200 bg-slate-50 px-[15px] transition duration-200 hover:border-slate-300 hover:bg-white focus-within:border-teal-500 focus-within:bg-white focus-within:shadow-[0_0_0_4px_rgba(20,184,166,0.12)]"
        >
          <svg
            [lucideIcon]="mailIcon"
            class="mr-3 h-5 w-5 text-slate-400 transition duration-200 group-focus-within:text-teal-500"
          ></svg>

          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="docente@email.com"
            autocomplete="email"
            class="w-full border-0 bg-transparent text-[15px] font-semibold text-slate-900 outline-none placeholder:text-slate-400"
          />
        </div>
      </div>

      <div>
        <div class="mb-2 flex items-center justify-between gap-3">
          <label class="block text-sm font-extrabold text-slate-900">
            Contraseña
          </label>

          <a
            routerLink="/auth/recuperar-password"
            class="text-[13px] font-extrabold text-teal-600 no-underline hover:underline"
          >
            Recuperar contraseña
          </a>
        </div>

        <div
          class="group flex h-[54px] items-center rounded-[17px] border border-slate-200 bg-slate-50 px-[15px] transition duration-200 hover:border-slate-300 hover:bg-white focus-within:border-teal-500 focus-within:bg-white focus-within:shadow-[0_0_0_4px_rgba(20,184,166,0.12)]"
        >
          <svg
            [lucideIcon]="lockIcon"
            class="mr-3 h-5 w-5 text-slate-400 transition duration-200 group-focus-within:text-teal-500"
          ></svg>

          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            autocomplete="current-password"
            class="w-full border-0 bg-transparent text-[15px] font-semibold text-slate-900 outline-none placeholder:text-slate-400"
          />
        </div>
      </div>

      @if (errorMessage) {
        <div
          class="animate-shake rounded-2xl bg-red-50 px-4 py-3 text-[13px] font-extrabold text-red-600"
        >
          {{ errorMessage }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading"
        class="flex h-[55px] items-center justify-center gap-2.5 rounded-[18px] border-0 bg-teal-500 text-[15px] font-black text-white shadow-[0_16px_28px_rgba(20,184,166,0.24)] transition duration-200 hover:-translate-y-0.5 hover:bg-teal-600 hover:shadow-[0_20px_34px_rgba(20,184,166,0.28)] active:translate-y-0 disabled:cursor-not-allowed disabled:opacity-75 disabled:hover:translate-y-0"
      >
        @if (loading) {
          <span class="custom-loader"></span>
          Validando acceso...
        } @else {
          Iniciar sesión
          <svg [lucideIcon]="arrowIcon" class="h-5 w-5"></svg>
        }
      </button>
    </form>

    <div class="mt-[26px] border-t border-slate-100 pt-5">
      <p class="mb-2.5 text-center text-[13px] font-extrabold text-slate-500">
        Usuarios de prueba
      </p>

      <div class="flex flex-wrap justify-center gap-2">
        <span class="rounded-full bg-slate-100 px-2.5 py-1.5 text-xs font-bold text-slate-600">
          docente@email.com
        </span>

        <span class="rounded-full bg-slate-100 px-2.5 py-1.5 text-xs font-bold text-slate-600">
          revisor@email.com
        </span>

        <span class="rounded-full bg-slate-100 px-2.5 py-1.5 text-xs font-bold text-slate-600">
          admin@email.com
        </span>
      </div>
    </div>
  </section>
</div>
