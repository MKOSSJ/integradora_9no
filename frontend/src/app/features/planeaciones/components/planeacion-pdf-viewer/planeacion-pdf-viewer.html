<div class="grid h-full min-h-[620px] grid-cols-[150px_minmax(0,1fr)] overflow-hidden bg-slate-100">

  <aside class="border-r border-slate-200 bg-white p-4 overflow-y-auto">

    <p class="mb-3 text-xs font-black uppercase tracking-wide text-slate-400">
      Páginas
    </p>

    @if (loading()) {
      <div class="space-y-3">
        @for (item of [1,2,3,4]; track item) {
          <div class="h-40 animate-pulse rounded-2xl bg-slate-100"></div>
        }
      </div>
    }

    @else {
      <div class="space-y-3">

        @for (page of pages(); track page) {

          <button
            type="button"
            class="w-full rounded-2xl border p-2 transition"
            [ngClass]="currentPage() === page
              ? 'border-teal-400 bg-teal-50'
              : 'border-slate-200 bg-white hover:bg-slate-50'"
            (click)="goToPage(page)"
          >

            <div class="flex h-32 items-center justify-center overflow-hidden rounded-xl bg-slate-50 text-xs font-black text-slate-400">

              <span>
                {{ page }}
              </span>

            </div>

            <span class="mt-2 block text-xs font-bold text-slate-500">
              Pág. {{ page }}
            </span>

          </button>

        }

      </div>
    }

  </aside>


  <section class="flex min-w-0 flex-col overflow-hidden">

    <div class="flex h-16 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-5">

      <div class="flex items-center gap-2">

        <button
          type="button"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 text-slate-500 transition hover:bg-slate-50 disabled:opacity-40"
          [disabled]="currentPage() <= 1"
          (click)="previousPage()"
        >
          <svg
            [lucideIcon]="prevIcon"
            class="h-5 w-5"
          ></svg>
        </button>


        <span class="text-sm font-bold text-slate-500">
          {{ currentPage() }} / {{ totalPages() }}
        </span>


        <button
          type="button"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 text-slate-500 transition hover:bg-slate-50 disabled:opacity-40"
          [disabled]="currentPage() >= totalPages()"
          (click)="nextPage()"
        >
          <svg
            [lucideIcon]="nextIcon"
            class="h-5 w-5"
          ></svg>
        </button>

      </div>


      <div class="flex items-center gap-2">

        <button
          type="button"
          class="inline-flex h-10 items-center gap-2 rounded-xl border border-slate-200 px-3 text-sm font-bold text-slate-600 transition hover:bg-slate-50"
          (click)="print()"
        >
          <svg
            [lucideIcon]="printIcon"
            class="h-4 w-4"
          ></svg>

          Imprimir
        </button>


        <button
          type="button"
          class="inline-flex h-10 items-center gap-2 rounded-xl border border-slate-200 px-3 text-sm font-bold text-slate-600 transition hover:bg-slate-50"
          (click)="download()"
        >
          <svg
            [lucideIcon]="downloadIcon"
            class="h-4 w-4"
          ></svg>

          Descargar
        </button>


        <button
          type="button"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 text-slate-500 transition hover:bg-slate-50 disabled:opacity-40"
          [disabled]="zoom() <= 50"
          (click)="zoomOut()"
        >
          <svg
            [lucideIcon]="zoomOutIcon"
            class="h-4 w-4"
          ></svg>
        </button>


        <span class="w-12 text-center text-sm font-bold text-slate-500">
          {{ zoom() }}%
        </span>


        <button
          type="button"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 text-slate-500 transition hover:bg-slate-50 disabled:opacity-40"
          [disabled]="zoom() >= 150"
          (click)="zoomIn()"
        >
          <svg
            [lucideIcon]="zoomInIcon"
            class="h-4 w-4"
          ></svg>
        </button>

      </div>

    </div>


<div class="min-h-0 flex-1 overflow-auto bg-slate-100 p-8">

  @if (loading()) {

    <div class="flex min-h-full items-center justify-center">

      <div class="text-center">

        <div class="mx-auto h-10 w-10 animate-spin rounded-full border-4 border-slate-200 border-t-teal-500"></div>

        <p class="mt-4 text-sm font-bold text-slate-500">
          Cargando PDF...
        </p>

      </div>

    </div>

  }

  @if (error()) {

    <div class="flex min-h-full items-center justify-center">

      <div class="rounded-2xl bg-red-50 px-6 py-5 text-center text-sm font-bold text-red-600">
        {{ error() }}
      </div>

    </div>

  }

  <div
    #pdfContainer
    class="flex min-h-full min-w-max items-start justify-center"
    [class.hidden]="loading() || error()"
  ></div>

</div>

  </section>

</div>
