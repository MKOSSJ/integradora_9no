<div class="min-h-full bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="px-7 py-4">
      <h1 class="text-xl font-black text-slate-900">
        Ciclos y Periodos
      </h1>

      <p class="text-sm font-medium text-slate-500">
        Administra los ciclos escolares y sus periodos académicos.
      </p>
    </div>

    <nav class="flex gap-2 overflow-x-auto px-7">
      <button
        type="button"
        class="inline-flex items-center gap-2 border-b-2 px-4 py-3 text-sm font-extrabold transition"
        [ngClass]="activeTab() === 'ciclos'
          ? 'border-teal-500 text-teal-600'
          : 'border-transparent text-slate-500 hover:text-slate-900'"
        (click)="setTab('ciclos')"
      >
        Ciclos escolares
      </button>

      <button
        type="button"
        class="inline-flex items-center gap-2 border-b-2 px-4 py-3 text-sm font-extrabold transition"
        [ngClass]="activeTab() === 'periodos'
          ? 'border-teal-500 text-teal-600'
          : 'border-transparent text-slate-500 hover:text-slate-900'"
        (click)="setTab('periodos')"
      >
        Periodos
      </button>
    </nav>
  </header>

  <app-admin-crud-page
    class="block"
    [class.hidden]="activeTab() !== 'ciclos'"
    [config]="config"
  />

  <app-admin-crud-page
    class="block"
    [class.hidden]="activeTab() !== 'periodos'"
    [config]="periodosConfig"
  />
</div>
