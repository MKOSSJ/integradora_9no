<div class="relative flex min-h-screen items-center justify-center overflow-hidden bg-slate-50 px-4 py-10">
  <div class="absolute -left-24 top-20 h-72 w-72 rounded-full bg-teal-200/40 blur-3xl"></div>
  <div class="absolute -right-24 bottom-20 h-72 w-72 rounded-full bg-cyan-200/40 blur-3xl"></div>

  <section class="relative w-full max-w-[390px] rounded-[28px] border border-slate-200 bg-white/95 px-7 py-8 shadow-2xl shadow-slate-200/80 backdrop-blur">
    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-3xl bg-teal-500 text-white shadow-xl shadow-teal-100">
      <svg [lucideIcon]="appIcon" class="h-8 w-8"></svg>
    </div>

    <div class="mt-6 text-center">
      <h1 class="text-2xl font-black tracking-tight text-slate-950">
        Sistema Académico
      </h1>

      <p class="mt-2 text-sm font-semibold text-slate-500">
        Inicia sesión para continuar
      </p>
    </div>

    <form class="mt-8" (ngSubmit)="onSubmit()">
      <div>
        <label class="text-sm font-black text-slate-900">
          Correo electrónico
        </label>

        <div class="mt-2 flex h-12 items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 px-4 transition focus-within:border-teal-400 focus-within:bg-white focus-within:ring-4 focus-within:ring-teal-100">
          <svg [lucideIcon]="emailIcon" class="h-5 w-5 text-slate-400"></svg>

          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            autocomplete="email"
            class="w-full bg-transparent text-sm font-bold text-slate-900 outline-none placeholder:text-slate-400"
            placeholder="correo@email.com"
          />
        </div>
      </div>

      <div class="mt-5">
        <div class="flex items-center justify-between gap-3">
          <label class="text-sm font-black text-slate-900">
            Contraseña
          </label>

          <a
            routerLink="/auth/recuperar-password"
            class="text-xs font-black text-teal-600 transition hover:text-teal-700"
          >
            Recuperar contraseña
          </a>
        </div>

        <div class="mt-2 flex h-12 items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 px-4 transition focus-within:border-teal-400 focus-within:bg-white focus-within:ring-4 focus-within:ring-teal-100">
          <svg [lucideIcon]="passwordIcon" class="h-5 w-5 text-slate-400"></svg>

          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            autocomplete="current-password"
            class="w-full bg-transparent text-sm font-bold text-slate-900 outline-none placeholder:text-slate-400"
            placeholder="Contraseña"
          />
        </div>
      </div>

      @if (errorMessage()) {
        <div class="mt-4 rounded-2xl bg-red-50 px-4 py-3 text-sm font-black text-red-600">
          {{ errorMessage() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="mt-5 inline-flex h-12 w-full items-center justify-center gap-2 rounded-2xl bg-teal-400 text-sm font-black text-white shadow-xl shadow-teal-100 transition hover:bg-teal-500 disabled:cursor-not-allowed disabled:opacity-80"
      >
        @if (loading()) {
          <svg [lucideIcon]="loaderIcon" class="h-5 w-5 animate-spin"></svg>
          Validando acceso...
        } @else {
          Iniciar sesión
        }
      </button>
    </form>

  </section>
</div>
